<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" fill="none" width="100%" height="100%">
  <!-- Card 1 (Back, rotated ~ -40deg) -->
  <g transform="translate(130, 260) rotate(-42) translate(-150, -90)">
    <rect width="280" height="175" rx="16" fill="#3F3F46" stroke="#52525B" stroke-width="2"/>
    <rect x="0" y="32" width="280" height="38" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- Card 2 (Middle, rotated ~ -20deg) -->
  <g transform="translate(200, 275) rotate(-22) translate(-150, -90)">
    <rect width="290" height="180" rx="16" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
    <rect x="0" y="34" width="290" height="40" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- Card 3 (Front, horizontal) -->
  <g transform="translate(180, 200)">
    <rect width="300" height="185" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2.5"/>
    <!-- Magnetic Stripe -->
    <rect x="0" y="35" width="300" height="40" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Debit Circles (Interlocking Mastercard/debit circles in white) -->
    <circle cx="50" cy="135" r="22" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="78" cy="135" r="22" fill="#FFFFFF" fill-opacity="0.85"/>
    
    <!-- Embossed dashes / details at bottom right -->
    <rect x="155" y="130" width="34" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="200" y="130" width="34" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="245" y="130" width="34" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 240" fill="none" width="100%" height="100%">
  <!-- Card Base with transparent background -->
  <rect x="10" y="10" width="330" height="220" rx="20" fill="#18181B" stroke="#27272A" stroke-width="2"/>
  
  <!-- EMV Chip at top left -->
  <g transform="translate(38, 42)">
    <rect width="52" height="42" rx="7" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="18" y2="42" stroke="#B45309" stroke-width="1.5"/>
    <line x1="34" y1="0" x2="34" y2="42" stroke="#B45309" stroke-width="1.5"/>
    <line x1="0" y1="21" x2="52" y2="21" stroke="#B45309" stroke-width="1.5"/>
    <rect x="18" y="12" width="16" height="18" rx="2" fill="#FBBF24"/>
  </g>
  
  <!-- Embossed card lines / details matching original credito.png -->
  <rect x="38" y="132" width="260" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="38" y="158" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="38" y="184" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>
</svg>
